name: Mi Band Remote APK

on:
  push:
    branches:
      - mi-band-remote
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mi-band-remote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Stub Firebase Dart configuration
        run: .github/scripts/stub_firebase_config.sh

      - name: Stub Android Firebase configuration
        shell: bash
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "qunleashed-mi-band-dev",
              "storage_bucket": "qunleashed-mi-band-dev.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.darkflippers.qunleashed"
                  }
                },
                "api_key": [
                  {"current_key": "dev-placeholder-key"}
                ],
                "services": {
                  "appinvite_service": {"other_platform_oauth_client": []}
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qUnleashed-mi-band-remote-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
