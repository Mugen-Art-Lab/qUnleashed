name: BLE Recovery Formatter

on:
  push:
    branches:
      - mi-band-remote
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Show BLE recovery formatter diff
        shell: bash
        run: |
          dart format lib/services/connection/ble_recovery.dart
          git diff -- lib/services/connection/ble_recovery.dart || true
