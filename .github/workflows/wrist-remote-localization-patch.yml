name: Wrist Remote rebase helper

on:
  push:
    branches:
      - wrist-remote-localization-patch

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrist-remote-rebase-r3
          fetch-depth: 0

      - name: Cherry-pick Wrist Remote onto current upstream base
        shell: bash
        run: |
          git config user.name "MrSoichi"
          git config user.email "21004580+MrSoichi@users.noreply.github.com"
          git fetch origin wrist-remote-pr
          git cherry-pick origin/wrist-remote-pr
          git push --force origin HEAD:wrist-remote-pr
